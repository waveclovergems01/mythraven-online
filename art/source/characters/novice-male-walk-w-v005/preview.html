<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novice — เทียบ idle และ walk</title><style>body{margin:0;padding:24px;background:#19231e;color:#f1e8d3;font:16px system-ui}main{max-width:1080px;margin:auto}h1{font-size:24px}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.views figure{margin:0;background:#303a35;border-radius:12px;text-align:center}canvas{width:100%;display:block;image-rendering:pixelated}figcaption{padding:12px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:10px;border:0;border-radius:6px}a{color:#e6c574}.frames{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.frames button{padding:0;background:#303a35;color:#eee;border:2px solid transparent}.frames img{width:100%;display:block}.frames .active{border-color:#e6c574}@media(max-width:700px){.views{grid-template-columns:1fr}.frames{grid-template-columns:repeat(4,1fr)}}</style><main><h1>Novice — หัวและสีเทียบกับ idle จริง</h1><p>ใช้ส่วนหัวจาก idle โดยตรง · สีชุดเทียบตามวัสดุ · รูปทรงแขนขาและจังหวะเดินเดิม</p><div class="views"><figure><canvas id="idle" width="240" height="240"></canvas><figcaption>Idle ในเกม</figcaption></figure><figure><canvas id="before" width="240" height="240"></canvas><figcaption>เดินก่อนแก้</figcaption></figure><figure><canvas id="after" width="240" height="240"></canvas><figcaption>เดินแก้ไข · <span id="counter"></span></figcaption></figure></div><nav><button id="play">หยุด</button><button id="prev">◀</button><button id="next">▶</button><select id="direction"><option value="w">ซ้าย</option><option value="e">ขวา</option></select><select id="speed"><option value="2">2 fps</option><option value="4">4 fps</option><option value="6">6 fps</option><option value="8">8 fps</option><option value="10" selected>10 fps</option><option value="12">12 fps</option><option value="14">14 fps</option></select></nav><div class="frames"></div><p><a href="novice-male-walk-w-v005.png">สไปรต์ชีต</a> · <a href="walk-preview.gif">GIF</a> · <a href="/">เข้าเกม</a></p></main><script type="module">
const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
const [idleW,idleE,before,...frames]=await Promise.all(['idle-w.png','idle-e.png','walk-before.png',...Array.from({length:8},(_,i)=>'frames/frame-'+String(i+1).padStart(2,'0')+'.png')].map(load));
let frame=0,paused=false,last=performance.now();const buttons=[],seen=new Set();
function paint(id,img,crop,flip=false){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,240,240);c.save();if(flip){c.translate(240,0);c.scale(-1,1)}c.drawImage(img,...crop,0,0,240,240);c.restore()}
function draw(){const east=document.querySelector('#direction').value==='e';paint('idle',east?idleE:idleW,[0,0,240,240]);paint('before',before,[frame%4*240,Math.floor(frame/4)*240,240,240],east);paint('after',frames[frame],[0,0,240,240],east);seen.add(frame+1);document.querySelector('#counter').textContent=(frame+1)+' / 8';document.querySelector('#play').textContent=paused?'เล่น':'หยุด';buttons.forEach((b,i)=>b.classList.toggle('active',i===frame))}
for(let i=0;i<8;i++){const b=document.createElement('button');b.innerHTML='<img src="'+frames[i].src+'" alt="เฟรม '+(i+1)+'">'+(i+1);b.onclick=()=>{frame=i;paused=true;draw()};document.querySelector('.frames').append(b);buttons.push(b)}
document.querySelector('#play').onclick=()=>{paused=!paused;last=performance.now();draw()};
for(const [id,step] of [['prev',-1],['next',1]])document.getElementById(id).onclick=()=>{paused=true;frame=(frame+step+8)%8;draw()};
document.querySelector('#direction').onchange=draw;document.querySelector('#speed').onchange=()=>last=performance.now();document.addEventListener('visibilitychange',()=>last=performance.now());
function tick(now){const interval=1000/Number(document.querySelector('#speed').value);if(!paused&&now-last>=interval){const steps=Math.floor((now-last)/interval);frame=(frame+steps)%8;last+=steps*interval;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.walkPreview=()=>({ready:true,frame:frame+1,paused,seen:[...seen]});
</script></html>
